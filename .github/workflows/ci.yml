name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-evidence
          path: |
            artifacts/
            sbom/
            dist/

  node-compatibility:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "24"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  otel-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "pnpm"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: node dist/cli.js otel-json fixtures/safe-typescript.trace.json > /tmp/agentproof-typescript.otlp.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "git+https://github.com/kingsokafor777-droid/agentproof-core.git@0c7f149bce6402cd4b91b08010a5a800b21f5d71"
      - run: python -m pip install "git+https://github.com/kingsokafor777-droid/agentproof-otel.git@58c73b582211dc28f72e11e62f0e22ca816ac7fe"
      - run: python scripts/verify_otel_contract.py /tmp/agentproof-typescript.otlp.json
